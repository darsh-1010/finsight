services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    networks:
      - finsight-chatbot-network
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  cron:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      - finsight-chatbot-network
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: python -m app.cron
    restart: unless-stopped


  # FastAPI Application for ML
  app:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: finsight-chatbot-app
    env_file: .env
    ports:
      - "8002:8000"
    environment:
      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4.1-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      FREELLMAPI_BASE_URL: http://freellmapi:3001/v1
      FREELLMAPI_KEY: freellmapi-62da5e0cda17bd929c31d3caba0ac2e02bd0c14a2242e97f

      # Weaviate Configuration (use container name for Docker networking)
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_GRPC_URL: weaviate:50051
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-}

      # Redis Configuration (use container name for Docker networking)
      REDIS_URL: redis://redis:6379/0
      SESSION_TTL_SECONDS: 3600

      # Application Settings
      DEBUG: 'false'

      # RAG Configuration
      EMBEDDING_MODEL: text-embedding-3-small
      TOP_K_RETRIEVAL: 10
      RERANK_TOP_K: 5
      CHUNK_SIZE: 1000
      CHUNK_OVERLAP: 200

      # PDF Scraper Configuration
      PDF_SCRAPER_TIMEOUT: 30
      PDF_MIN_CONTENT_LENGTH: 300
    depends_on:
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
      freellmapi:
        condition: service_healthy
    networks:
      - finsight-chatbot-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/ready" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    volumes:
      - ./ml/src:/app/src
      - ./ml/config:/app/config
      - ./ml/logs:/app/logs
      - ./ml/outputs:/app/outputs

  # Scraper Scheduler (runs continuously and fires scrapers at configured times)
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: finsight-scraper-scheduler
    env_file: .env
    # Override the default CMD so this container runs the scheduler, not the API
    command: ["python", "-m", "src.scripts.scraper_scheduler"]
    restart: unless-stopped
    environment:
      # OpenAI (needed for Weaviate embedding after ingestion)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4.1-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      FREELLMAPI_BASE_URL: http://freellmapi:3001/v1
      FREELLMAPI_KEY: freellmapi-62da5e0cda17bd929c31d3caba0ac2e02bd0c14a2242e97f

      # Weaviate (use container name for Docker networking)
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_GRPC_URL: weaviate:50051
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-}

      # Redis (use container name for Docker networking)
      REDIS_URL: redis://redis:6379/0

      # Scraper Schedule
      ML_SCRAPER_RUN_TIME: ${ML_SCRAPER_RUN_TIME:-04:30 AM}
      ML_SCRAPER_MAX_WORKERS: ${ML_SCRAPER_MAX_WORKERS:-2}

      # RAG Configuration
      EMBEDDING_MODEL: text-embedding-3-small
      CHUNK_SIZE: 1000
      CHUNK_OVERLAP: 200

      # PDF Scraper
      PDF_SCRAPER_TIMEOUT: 30
      PDF_MIN_CONTENT_LENGTH: 300

      # Environment
      PYTHONPATH: /app
      # Timezone — set this to match your local timezone so cron times are correct
      TZ: ${ML_SCRAPER_TIMEZONE:-Asia/Kolkata}
      ML_SCRAPER_TIMEZONE: ${ML_SCRAPER_TIMEZONE:-Asia/Kolkata}

      # Explicit memory limit for Crawlee (in MB)
      CRAWLEE_MEMORY_MBYTES: 6144

      # Backend API Integration for local development
      ML_DATA_TRANSFER_BASE_URL: ${ML_DATA_TRANSFER_BASE_URL:-http://host.docker.internal:8001}
    init: true
    shm_size: '1gb'
    # Allows containerized scrapers to reach services running on the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 6G
    depends_on:
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
      freellmapi:
        condition: service_healthy
    networks:
      - finsight-chatbot-network
    healthcheck:
      disable: true
    volumes:
      - ./ml/src:/app/src
      - ./ml/config:/app/config
      - ./ml/logs:/app/logs
      - ./ml/outputs:/app/outputs

  # Weaviate Vector Database
  weaviate:
    image: semitechnologies/weaviate:1.27.6
    container_name: finsight-chatbot-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai'
      CLUSTER_HOSTNAME: 'node1'
      # OpenAI configuration for embeddings
      OPENAI_APIKEY: ${OPENAI_API_KEY}
      # Performance Tuning (Disabled async for stability)
      ASYNC_INDEXING: 'false'
      WRITE_TIMEOUT: '600s'
      READ_TIMEOUT: '600s'
    volumes:
      - weaviate_data_v2:/var/lib/weaviate
    networks:
      - finsight-chatbot-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: finsight-postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finsight-chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: finsight-chatbot-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - finsight-chatbot-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - finsight-chatbot-network

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: finsight-freellmapi
    ports:
      - "3003:3001"
    environment:
      - ENCRYPTION_KEY=1234567890123456789012345678901234567890123456789012345678901234
      - API_KEY=freellmapi-unified-key
    networks:
      - finsight-chatbot-network
    volumes:
      - freellmapi_data:/app/server/data

volumes:
  freellmapi_data:
    driver: local
  weaviate_data_v2:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  finsight-chatbot-network:
    driver: bridge
