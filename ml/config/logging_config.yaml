# Logging Configuration
# Structured logging settings for the application

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout
  app_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8
  scraper_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/web_scraping.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

loggers:
  src.services.scrapper:
    level: INFO
    handlers: [console, scraper_file]
    propagate: false
  src.scripts:
    level: INFO
    handlers: [console, scraper_file]
    propagate: false
  src:
    level: INFO
    handlers: [console, app_file]
    propagate: false
  api:
    level: INFO
    handlers: [console, app_file]
    propagate: false
  httpx:
    level: WARNING
    handlers: [app_file]
    propagate: false
  weaviate:
    level: WARNING
    handlers: [app_file]
    propagate: false

root:
  level: INFO
  handlers: [console, app_file]
